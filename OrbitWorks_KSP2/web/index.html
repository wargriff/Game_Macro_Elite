<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OrbitWorks KSP2 — 3D</title>
  <link rel="stylesheet" href="/web/css/app.css"/>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">OW</div>
        <div>
          <h1>OrbitWorks</h1>
          <p>KSP 2 · modèles 3D · IDs stock</p>
        </div>
      </div>
      <div class="tabs" id="tabs"></div>
      <input id="q" placeholder="Chercher Starship, Starlink, Mun…"/>
      <div class="chips" id="chips"></div>
      <div class="status" id="status"></div>
      <div class="list" id="list"></div>
    </aside>
    <main class="stage">
      <div id="viewport"></div>
      <div class="hud" id="hud">
        <h2 id="hud-title">Sélectionne un modèle</h2>
        <p id="hud-sub">Prévisualisation 3D procédurale (pas les meshes propriétaires KSP2)</p>
        <div class="stats" id="hud-stats"></div>
        <div class="actions">
          <button id="btn-blueprint">Voir blueprint</button>
          <button id="btn-rotate" class="ghost">Auto-rotate</button>
        </div>
        <pre id="blueprint-box" class="hidden"></pre>
      </div>
      <div class="notice">
        Assets 3D = reconstructions OrbitWorks. Pour jouer : reconstruis dans le VAB avec les noms de pièces stock listés dans le blueprint.
      </div>
    </main>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/web/js/app.js"></script>
</body>
</html>
